name: CI

# Baut + testet jeden overlay-agent-Branch und jeden PR.
# Dient als Gate: erst wenn dieser Workflow gruen ist, darf Auto-Merge greifen.

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - 'overlay-agent/**'

# Nur der jeweils neueste Lauf pro Branch/PR, aeltere werden abgebrochen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install (npm ci)
        run: npm ci

      - name: Build (shared + server + web)
        run: npm run build

      - name: Test (server)
        run: npm test
